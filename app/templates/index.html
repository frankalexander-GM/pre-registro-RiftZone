<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Registro - RiftZone</title>

    <link href="{{ url_for('static', filename='css/riftzone.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* === KEYFRAMES === */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes orbMove1 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(80px, -120px) scale(1.1); }
            50% { transform: translate(-60px, -200px) scale(0.9); }
            75% { transform: translate(100px, -80px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes orbMove2 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-100px, 60px) scale(1.15); }
            50% { transform: translate(70px, 120px) scale(0.85); }
            75% { transform: translate(-80px, -40px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes orbMove3 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(120px, 80px) scale(1.2); }
            66% { transform: translate(-90px, -60px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1); }
        }

        @keyframes msgSlideIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes iconBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* === FONDO ANIMADO CANVAS === */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* === MAIN STYLES === */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #050510;
            padding: 24px;
            overflow: hidden;
        }

        .pre-registro-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            text-align: center;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        .pre-registro-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-magenta), var(--accent-blue), var(--accent-purple));
            background-size: 300% 100%;
            animation: gradientShift 4s ease infinite;
        }

        .logo-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            animation: fadeInScale 0.6s ease-out 0.2s both;
        }

        .logo-center .logo-icon {
            width: 52px; height: 52px;
            font-size: 26px;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 36px;
            line-height: 1.5;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            animation: slideInLeft 0.5s ease-out 0.6s both;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(16, 224, 240, 0.2), 0 0 20px rgba(16, 224, 240, 0.1);
            transform: scale(1.01);
        }

        .btn-registro {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            justify-content: center;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
            background-size: 200% 200%;
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.5s ease-out 0.8s both;
            position: relative;
            overflow: hidden;
        }

        .btn-registro::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-registro:hover::after {
            transform: rotate(45deg) translateX(100%);
        }

        .btn-registro:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 25px rgba(16, 224, 240, 0.5), 0 0 50px rgba(128, 48, 240, 0.3);
            background-size: 100% 100%;
        }

        .btn-registro:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-registro:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .msg {
            margin-top: 24px;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .msg.success {
            display: block;
            background: rgba(80, 240, 96, 0.1);
            border-left: 4px solid var(--accent-green);
            color: var(--accent-green);
            animation: msgSlideIn 0.4s ease-out;
        }

        .msg.error {
            display: block;
            background: rgba(240, 60, 60, 0.1);
            border-left: 4px solid #F03C3C;
            color: #F03C3C;
            animation: msgSlideIn 0.4s ease-out;
        }

        .msg.info {
            display: block;
            background: rgba(96, 240, 240, 0.1);
            border-left: 4px solid var(--accent-magenta);
            color: var(--accent-magenta);
            animation: msgSlideIn 0.4s ease-out;
        }

        .features {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: fadeInUp 0.5s ease-out both;
            transition: transform 0.3s ease;
            cursor: default;
        }

        .feature-item:nth-child(1) { animation-delay: 1.0s; }
        .feature-item:nth-child(2) { animation-delay: 1.15s; }
        .feature-item:nth-child(3) { animation-delay: 1.3s; }
        .feature-item:nth-child(4) { animation-delay: 1.45s; }
        .feature-item:nth-child(5) { animation-delay: 1.6s; }

        .feature-item:hover {
            transform: translateY(-4px);
        }

        .feature-item:hover i {
            animation: iconBounce 0.4s ease;
        }

        .feature-item i {
            font-size: 20px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.3s ease;
        }

        .feature-item span {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .feature-item:hover span {
            color: var(--text-main);
        }
    </style>
</head>
<body>

<!-- Fondo animado -->
<canvas id="bg-canvas"></canvas>

<div class="pre-registro-container">
    <div class="logo-center">
        <div class="logo-icon"><i class="fas fa-gamepad"></i></div>
        RiftZone
    </div>

    <p class="subtitle">
        Estamos construyendo la red social gaming definitiva.<br>
        Déjanos tu correo y sé el primero en entrar.
    </p>

    <form id="pre-registro-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label"><i class="fas fa-envelope" style="margin-right:6px; color:var(--accent-purple);"></i>Correo Electrónico</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="tu@correo.com"
                required
                autocomplete="email"
                class="form-control"
            >
        </div>

        <button type="submit" id="btn-submit" class="btn-registro">
            <i class="fas fa-rocket"></i> Pre-registrarme
        </button>
    </form>

    <div id="message" class="msg"></div>

    <div class="features">
        <div class="feature-item">
            <i class="fas fa-users"></i>
            <span>Comunidad</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-trophy"></i>
            <span>Clanes</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-comments"></i>
            <span>Chat</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-shield-halved"></i>
            <span>Seguro</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-tower-broadcast"></i>
            <span>Live</span>
        </div>
    </div>
</div>

<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>

<script>
    // === FONDO ANIMADO ===
    (function() {
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let nodes = [];
        const nodeCount = 80;
        const connectionDist = 150;
        const colors = ['#8030F0', '#10E0F0', '#50F060', '#60F0F0', '#70B0F0'];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        resizeBg();
        window.addEventListener('resize', resizeBg);

        for (let i = 0; i < nodeCount; i++) {
            nodes.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2.5 + 1,
                color: colors[Math.floor(Math.random() * colors.length)],
                pulse: Math.random() * Math.PI * 2
            });
        }

        function drawBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            // Gradiente de fondo sutil
            const grad = bgCtx.createRadialGradient(
                bgCanvas.width / 2, bgCanvas.height / 2, 0,
                bgCanvas.width / 2, bgCanvas.height / 2, bgCanvas.width * 0.7
            );
            grad.addColorStop(0, 'rgba(8, 2, 25, 1)');
            grad.addColorStop(0.5, 'rgba(5, 5, 16, 1)');
            grad.addColorStop(1, 'rgba(2, 2, 8, 1)');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            // Dibujar conexiones
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < connectionDist) {
                        const opacity = (1 - dist / connectionDist) * 0.15;
                        bgCtx.strokeStyle = nodes[i].color.replace(')', `, ${opacity})`).replace('rgb', 'rgba').replace('#', '');

                        // Convertir hex a rgba para las lineas
                        const hex = nodes[i].color;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        bgCtx.strokeStyle = `rgba(${r},${g},${b},${opacity})`;

                        bgCtx.lineWidth = 0.5;
                        bgCtx.beginPath();
                        bgCtx.moveTo(nodes[i].x, nodes[i].y);
                        bgCtx.lineTo(nodes[j].x, nodes[j].y);
                        bgCtx.stroke();
                    }
                }
            }

            // Dibujar nodos
            for (const node of nodes) {
                node.pulse += 0.02;
                const pulseSize = Math.sin(node.pulse) * 0.5 + 1;

                // Glow
                const hex = node.color;
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);

                bgCtx.beginPath();
                bgCtx.arc(node.x, node.y, node.radius * pulseSize * 3, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(${r},${g},${b},0.05)`;
                bgCtx.fill();

                bgCtx.beginPath();
                bgCtx.arc(node.x, node.y, node.radius * pulseSize, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(${r},${g},${b},0.8)`;
                bgCtx.fill();

                // Mover
                node.x += node.vx;
                node.y += node.vy;

                if (node.x < 0 || node.x > bgCanvas.width) node.vx *= -1;
                if (node.y < 0 || node.y > bgCanvas.height) node.vy *= -1;
            }

            requestAnimationFrame(drawBg);
        }
        drawBg();
    })();

    // === CONFETTI ===
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiPieces = [];
    let confettiActive = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const confettiColors = ['#8030F0', '#60F0F0', '#10E0F0', '#50F060', '#70B0F0', '#001050', '#A050FF', '#30FFD0'];

    function launchConfetti() {
        confettiPieces = [];
        for (let i = 0; i < 150; i++) {
            confettiPieces.push({
                x: Math.random() * canvas.width,
                y: canvas.height + 10,
                w: Math.random() * 10 + 5,
                h: Math.random() * 6 + 3,
                color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                vx: (Math.random() - 0.5) * 12,
                vy: -(Math.random() * 18 + 10),
                gravity: 0.25,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 12,
                opacity: 1,
                fade: Math.random() * 0.005 + 0.003,
                shape: Math.random() > 0.5 ? 'rect' : 'circle'
            });
        }
        confettiActive = true;
        animateConfetti();
    }

    function animateConfetti() {
        if (!confettiActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let alive = false;
        for (const p of confettiPieces) {
            if (p.opacity <= 0) continue;
            alive = true;

            p.x += p.vx;
            p.vy += p.gravity;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            p.opacity -= p.fade;
            p.vx *= 0.99;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;

            if (p.shape === 'rect') {
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        if (alive) {
            requestAnimationFrame(animateConfetti);
        } else {
            confettiActive = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    // === FORM ===
    const form = document.getElementById('pre-registro-form');
    const msgDiv = document.getElementById('message');
    const btnSubmit = document.getElementById('btn-submit');
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        msgDiv.className = 'msg';
        msgDiv.removeAttribute('style');
        msgDiv.textContent = '';
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

        try {
            const res = await fetch('/pre-registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({ email }),
            });

            const data = await res.json();

            if (data.status === 'success') {
                msgDiv.className = 'msg success';
                msgDiv.innerHTML = '<i class="fas fa-check-circle" style="margin-right:8px;"></i>' + data.message + '<br><span style="font-size:12px;opacity:0.8;font-weight:400;margin-top:6px;display:inline-block;">Revisa tu bandeja de entrada o la carpeta de spam.</span>';
                form.reset();
                launchConfetti();
            } else if (res.status === 409) {
                msgDiv.className = 'msg info';
                msgDiv.innerHTML = '<i class="fas fa-heart" style="margin-right:8px;"></i>¡Ya estás en la lista! Tu correo fue registrado anteriormente.<br><span style="font-size:12px;opacity:0.8;font-weight:400;margin-top:6px;display:inline-block;">Tranquilo, te avisaremos cuando lancemos. ¡Gracias por tu entusiasmo!</span>';
            } else {
                msgDiv.className = 'msg error';
                msgDiv.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-right:8px;"></i>' + data.message;
            }
        } catch (err) {
            msgDiv.className = 'msg error';
            msgDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="margin-right:8px;"></i>Error de conexión. Intenta de nuevo.';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fas fa-rocket"></i> Pre-registrarme';
        }
    });
</script>

</body>
</html>
