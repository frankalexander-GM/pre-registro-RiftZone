<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Registro - RiftZone</title>

    <link href="{{ url_for('static', filename='css/riftzone.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* === KEYFRAMES === */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.6), 0 0 60px rgba(255, 45, 149, 0.2); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes msgSlideIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes iconBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* === PARTICLES BACKGROUND === */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            bottom: -10px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--accent-purple);
            animation: particleFloat linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; width: 3px; height: 3px; background: var(--accent-magenta); }
        .particle:nth-child(2) { left: 25%; animation-duration: 15s; animation-delay: 2s; width: 5px; height: 5px; }
        .particle:nth-child(3) { left: 40%; animation-duration: 10s; animation-delay: 4s; width: 3px; height: 3px; background: var(--accent-blue); }
        .particle:nth-child(4) { left: 55%; animation-duration: 18s; animation-delay: 1s; width: 4px; height: 4px; background: var(--accent-magenta); }
        .particle:nth-child(5) { left: 70%; animation-duration: 14s; animation-delay: 3s; width: 6px; height: 6px; }
        .particle:nth-child(6) { left: 85%; animation-duration: 11s; animation-delay: 5s; width: 3px; height: 3px; background: var(--accent-blue); }
        .particle:nth-child(7) { left: 15%; animation-duration: 16s; animation-delay: 7s; width: 4px; height: 4px; background: var(--accent-green); }
        .particle:nth-child(8) { left: 60%; animation-duration: 13s; animation-delay: 6s; width: 5px; height: 5px; background: var(--accent-magenta); }

        /* === MAIN STYLES === */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, var(--bg-panel) 0%, var(--bg-dark) 100%);
            padding: 24px;
        }

        .pre-registro-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            text-align: center;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        .pre-registro-container:hover {
            animation: glowPulse 3s ease-in-out infinite;
        }

        .pre-registro-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-magenta), var(--accent-blue), var(--accent-purple));
            background-size: 300% 100%;
            animation: gradientShift 4s ease infinite;
        }

        .logo-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            animation: fadeInScale 0.6s ease-out 0.2s both;
        }

        .logo-center .logo-icon {
            width: 52px; height: 52px;
            font-size: 26px;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .logo-center .logo-icon:hover {
            animation: iconBounce 0.4s ease;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 36px;
            line-height: 1.5;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            animation: slideInLeft 0.5s ease-out 0.6s both;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2), 0 0 20px rgba(139, 92, 246, 0.1);
            transform: scale(1.01);
        }

        .btn-registro {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            justify-content: center;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
            background-size: 200% 200%;
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.5s ease-out 0.8s both;
            position: relative;
            overflow: hidden;
        }

        .btn-registro::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-registro:hover::after {
            transform: rotate(45deg) translateX(100%);
        }

        .btn-registro:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5), 0 0 50px rgba(255, 45, 149, 0.2);
            background-size: 100% 100%;
        }

        .btn-registro:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-registro:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .msg {
            margin-top: 24px;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--accent-green);
            color: var(--accent-green);
            animation: msgSlideIn 0.4s ease-out;
        }

        .msg.error {
            display: block;
            background: rgba(255, 45, 149, 0.1);
            border-left: 4px solid var(--accent-magenta);
            color: var(--accent-magenta);
            animation: msgSlideIn 0.4s ease-out;
        }

        .features {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: fadeInUp 0.5s ease-out both;
            transition: transform 0.3s ease;
            cursor: default;
        }

        .feature-item:nth-child(1) { animation-delay: 1.0s; }
        .feature-item:nth-child(2) { animation-delay: 1.15s; }
        .feature-item:nth-child(3) { animation-delay: 1.3s; }
        .feature-item:nth-child(4) { animation-delay: 1.45s; }

        .feature-item:hover {
            transform: translateY(-4px);
        }

        .feature-item:hover i {
            animation: iconBounce 0.4s ease;
        }

        .feature-item i {
            font-size: 20px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.3s ease;
        }

        .feature-item span {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .feature-item:hover span {
            color: var(--text-main);
        }
    </style>
</head>
<body>

<!-- Partículas animadas de fondo -->
<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="pre-registro-container">
    <div class="logo-center">
        <div class="logo-icon"><i class="fas fa-gamepad"></i></div>
        RiftZone
    </div>

    <p class="subtitle">
        Estamos construyendo la red social gaming definitiva.<br>
        Déjanos tu correo y sé el primero en entrar.
    </p>

    <form id="pre-registro-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label"><i class="fas fa-envelope" style="margin-right:6px; color:var(--accent-purple);"></i>Correo Electrónico</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="tu@correo.com"
                required
                autocomplete="email"
                class="form-control"
            >
        </div>

        <button type="submit" id="btn-submit" class="btn-registro">
            <i class="fas fa-rocket"></i> Pre-registrarme
        </button>
    </form>

    <div id="message" class="msg"></div>

    <div class="features">
        <div class="feature-item">
            <i class="fas fa-users"></i>
            <span>Comunidad</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-trophy"></i>
            <span>Clanes</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-comments"></i>
            <span>Chat</span>
        </div>
        <div class="feature-item">
            <i class="fas fa-shield-halved"></i>
            <span>Seguro</span>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('pre-registro-form');
    const msgDiv = document.getElementById('message');
    const btnSubmit = document.getElementById('btn-submit');
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        msgDiv.className = 'msg';
        msgDiv.style.display = 'none';
        msgDiv.textContent = '';
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

        try {
            const res = await fetch('/pre-registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({ email }),
            });

            const data = await res.json();

            if (data.status === 'success') {
                msgDiv.className = 'msg success';
                msgDiv.innerHTML = '<i class="fas fa-check-circle" style="margin-right:8px;"></i>' + data.message;
                form.reset();
            } else {
                msgDiv.className = 'msg error';
                msgDiv.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-right:8px;"></i>' + data.message;
            }
        } catch {
            msgDiv.className = 'msg error';
            msgDiv.innerHTML = '<i class="fas fa-wifi" style="margin-right:8px;"></i>Error de conexión. Intenta de nuevo.';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fas fa-rocket"></i> Pre-registrarme';
        }
    });
</script>

</body>
</html>
